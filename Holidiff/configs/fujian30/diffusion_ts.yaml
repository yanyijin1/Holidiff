task_name: long_term_forecast
is_training: 1
model_id: Fujian30_96_12_DiffusionTS
model: DiffusionTS

# dataset
data: fujian30
root_path: /root/yanyijin/STdiff/Holidiff/data/fujian-30
data_path: fujian30_clean.csv
features: M
target: traffic_flow
freq: 15min
checkpoints: /root/yanyijin/STdiff/Holidiff/checkpoints/

time_col: time_slot
node_col: station_index
target_col: traffic_flow
holiday_col: is_holiday
adj_path: /root/yanyijin/STdiff/Holidiff/data/fujian-30/adjacent_gantry.csv
scale: true
mode: standard

# forecasting window
seq_len: 96
label_len: 48
pred_len: 12
seasonal_patterns: Monthly
inverse: false
enc_in: 30
dec_in: 30
c_out: 30

# minimal host compatibility fields
network_profile: base
d_model: 128
n_heads: 8
e_layers: 1
d_layers: 1
d_ff: 512
expand: 2
d_conv: 4
factor: 1
embed: timeF
distil: true
dropout: 0.0
activation: gelu
top_k: 5
num_kernels: 6

# DiffusionTS core params
is_diff: 1
loss_type: MAE
diffusion_ts_seq_length: 108
diffusion_ts_feature_size: 30
diffusion_ts_timesteps: 1000
diffusion_ts_sampling_timesteps: 20
diffusion_ts_loss_type: l1
diffusion_ts_beta_schedule: cosine
diffusion_ts_n_layer_enc: 3
diffusion_ts_n_layer_dec: 6
diffusion_ts_d_model: 128
diffusion_ts_n_heads: 8
diffusion_ts_mlp_hidden_times: 4
diffusion_ts_eta: 0.0
diffusion_ts_attn_pd: 0.0
diffusion_ts_resid_pd: 0.0
diffusion_ts_use_ff: true
diffusion_ts_reg_weight: null

# evaluation / sampling
sample_times: 1
vs_times: 1

# run
num_workers: 0
itr: 1
train_epochs: 1
batch_size: 32
eval_batch_size: 128
patience: 10
learning_rate: 0.0001
des: DiffusionTS
loss: MSE
lradj: type1
use_amp: false

# device
use_gpu: true
gpu: 0
use_multi_gpu: false
devices: '0'

# seed / eval
seed: 2021
eval_gamma: 0.5
eval_delta_t: 1.0
eval_peak_radius: 1
eval_bandwidth_scale: 0.5
