task_name: long_term_forecast
is_training: 1
version: ''
model_id: Fujian30_96_36_DiffusionTS
model: DiffusionTS

# dataset
data: fujian30
root_path: /root/autodl-tmp/STdiff_data/fujian-30
data_path: fujian30_clean.csv
features: M
target: traffic_flow
freq: 15min
checkpoints: /root/autodl-tmp/STdiff_runs/checkpoints/fujian30

time_col: time_slot
node_col: station_index
target_col: traffic_flow
holiday_col: is_holiday
adj_path: /root/autodl-tmp/STdiff_data/fujian-30/adjacent_gantry.csv
scale: true
mode: standard

# forecasting window
seq_len: 96
label_len: 48
pred_len: 36
seasonal_patterns: Monthly
inverse: false
enc_in: 30
dec_in: 30
c_out: 30

# minimal host compatibility fields
network_profile: tiny
d_model: 64
n_heads: 4
e_layers: 1
d_layers: 1
d_ff: 128
expand: 2
d_conv: 4
factor: 1
embed: timeF
distil: true
dropout: 0.0
activation: gelu
top_k: 5
num_kernels: 6

# DiffusionTS core params
is_diff: 1
loss_type: MAE
diffusion_ts_seq_length: 132
diffusion_ts_feature_size: 30
diffusion_ts_timesteps: 500
diffusion_ts_sampling_timesteps: 200
diffusion_ts_loss_type: l1
diffusion_ts_beta_schedule: cosine
diffusion_ts_n_layer_enc: 3
diffusion_ts_n_layer_dec: 2
diffusion_ts_d_model: 64
diffusion_ts_n_heads: 4
diffusion_ts_mlp_hidden_times: 4
diffusion_ts_eta: 0.0
diffusion_ts_attn_pd: 0.0
diffusion_ts_resid_pd: 0.0
diffusion_ts_use_ff: true
diffusion_ts_reg_weight: null
diffusion_ts_clip_denoised: false
diffusion_ts_use_ema: true
diffusion_ts_use_ema_sampling: true
diffusion_ts_ema_decay: 0.995
diffusion_ts_ema_update_every: 10
diffusion_ts_beta1: 0.9
diffusion_ts_beta2: 0.96
diffusion_ts_langevin_coef: 0.01
diffusion_ts_langevin_lr: 0.05
diffusion_ts_langevin_coef_inner: 0.0
diffusion_ts_validate_with_sampling: false
diffusion_ts_validation_sample_times: 1
diffusion_ts_gradient_accumulate_every: 2
diffusion_ts_grad_clip: 1.0
diffusion_ts_scheduler_factor: 0.5
diffusion_ts_scheduler_patience: 4000
diffusion_ts_scheduler_min_lr: 1.0e-5
diffusion_ts_scheduler_threshold: 0.1
diffusion_ts_scheduler_threshold_mode: rel
diffusion_ts_warmup_lr: 8.0e-4
diffusion_ts_warmup: 500

# evaluation / sampling
sample_times: 1
vs_times: 1

# run
num_workers: 0
itr: 1
train_epochs: 30
batch_size: 32
eval_batch_size: 128
patience: 20
learning_rate: 0.0001
des: DiffusionTS
loss: MSE
lradj: constant
use_amp: false
log_interval: 100

# device
use_gpu: true
gpu: 0
use_multi_gpu: false
devices: '0'

# seed / eval
seed: 2021
eval_gamma: 0.5
eval_delta_t: 1.0
eval_peak_radius: 1
eval_bandwidth_scale: 0.5
zero_as_missing: true
