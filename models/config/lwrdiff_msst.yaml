# LWRDiff Training Configuration - MSST Speed Dataset

experiment:
  name: lwrdiff_msst_speed
  task_name: long_term_forecast
  model: LWRdiff
  model_id: msst_speed_96_12
  des: msst_speed_seed42
  itr: 1

data:
  data: custom
  root_path: ./data/
  data_path: msst_speed.csv
  features: M
  target: s0
  freq: t
  enc_in: 30
  dec_in: 30
  c_out: 30

window:
  seq_len: 96
  label_len: 48
  pred_len: 12

model_args:
  e_layers: 1
  d_model: 128
  num_heads: 8
  stride: 3
  patch_len: 6
  dropout: 0.0
  d_ff: 512
  d_layers: 1

optimization:
  seed: 42
  batch_size: 32
  train_epochs: 30
  patience: 8
  learning_rate: 0.0001
  loss_type: MAE

sampling:
  is_diff: 1
  diff_steps: 100
  s_steps: 2
  skip_type: time_uniform
  method: multistep
  order: 2
  lower_order_final: "true"
  sample_times: 20
  vs_times: 5
  use_mom: 1
  mom_mode: mom
  mom_tau: 5.0
  mom_clusters: 2
  new_norm: 1
  rmom: 20
  n_b: 5
  coss: 0.008
  debug: true
