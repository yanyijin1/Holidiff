# LWRDiff Training Configuration
# Based on need/LWRdiff/script/train_msst_speed.yaml

experiment:
  name: lwrdiff_train
  task_name: long_term_forecast
  model: LWRdiff
  model_id: lwrdiff_96_12
  des: lwrdiff_baseline
  itr: 1

data:
  data: ETTh1
  root_path: /root/yanyijin/STdiff/models/data/
  data_path: msst_speed.csv
  features: M
  target: OT
  freq: h
  enc_in: 30
  dec_in: 30
  c_out: 30

graph:
  enabled: true
  adj_path: /root/yanyijin/STdiff/models/data/adjacent_gantry.csv
  num_nodes: 30

window:
  seq_len: 96
  label_len: 48
  pred_len: 96

model_args:
  e_layers: 2
  d_model: 512
  num_heads: 8
  stride: 8
  patch_len: 16
  dropout: 0.1
  skip_dropout: 0.1
  d_ff: 1024

optimization:
  seed: 2021
  batch_size: 32
  train_epochs: 30
  patience: 3
  learning_rate: 0.0001
  loss_type: MSE

sampling:
  is_diff: 1
  diff_steps: 100
  s_steps: 5
  skip_type: time_uniform
  method: multistep
  order: 2
  lower_order_final: "true"
  sample_times: 50
  vs_times: 10
  use_mom: 1
  mom_mode: mom
  mom_tau: 5.0
  mom_clusters: 2
  new_norm: 1
  rmom: 20
  n_b: 5
  coss: 0.008
