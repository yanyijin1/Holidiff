# LWRDiff Training Configuration - Phase 1: PCGK-GAT
# 基于 lwrdiff_96_12_v2.yaml，切换到 LWRGAT 模型

experiment:
  name: lwrdiff_train_lwrgat_phase1
  task_name: long_term_forecast
  model: LWRdiff
  model_id: lwrdiff_phase1_pcgk
  des: pcgk_gat_phase1
  itr: 1
  seed: 42

# 模型切换配置
model_switch:
  use_stformer: false
  use_lwrgat: true   # 启用 LWRGAT 模型
  st_layers: 2        # Phase 1: 2 层（减少参数加速验证）

data:
  data: custom
  root_path: /root/yanyijin/STdiff/models/data/
  data_path: msst_speed.csv      # 速度数据
  flow_path: msst_flow.csv       # 流量数据（LWRGAT 双流输入）
  features: M
  target: s0
  freq: t
  enc_in: 30
  dec_in: 30
  c_out: 30

graph:
  enabled: true
  adj_path: /root/yanyijin/STdiff/models/data/adjacent_gantry.csv
  num_nodes: 30

window:
  seq_len: 96
  label_len: 48
  pred_len: 12

# 轻量化模型参数
model_args:
  e_layers: 1
  d_model: 64
  num_heads: 4
  stride: 3
  patch_len: 6
  dropout: 0.1
  skip_dropout: 0.1
  d_ff: 256

optimization:
  batch_size: 32
  train_epochs: 2  # 测试用 2 个 epoch
  patience: 8
  learning_rate: 0.0005
  loss_type: MAE

sampling:
  is_diff: 1
  diff_steps: 100
  s_steps: 2
  skip_type: time_uniform
  method: multistep
  order: 2
  lower_order_final: "true"
  sample_times: 20
  vs_times: 5
  use_mom: 1
  new_norm: 1
  rmom: 20
  n_b: 5
  coss: 0.008

metrics:
  use_dtw: false
