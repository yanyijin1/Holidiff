# LWRRes - 快速验证：固定 temperature=1.0，3 epoch 测试
experiment:
  task_name: long_term_forecast
  model: LWRdiff_res
  model_id: lwrdiff_phase2_temp_fixed
  des: LWRRes_temp_fixed
  itr: 1
  seed: 42

data:
  data: custom
  root_path: /root/yanyijin/STdiff/models/data/
  data_path: msst_speed.csv
  flow_path: msst_flow.csv
  features: M
  target: s0
  freq: t
  enc_in: 30
  dec_in: 30
  c_out: 30

window:
  seq_len: 96
  label_len: 48
  pred_len: 12

model_args:
  e_layers: 2
  d_layers: 1
  d_model: 64
  num_heads: 4
  d_ff: 256
  dropout: 0.1
  stride: 3
  patch_len: 6
  embed: timeF
  activation: gelu
  output_attention: false
  skip_dropout: 0.1
  use_tst_layer: false

graph:
  enabled: true
  adj_path: /root/yanyijin/STdiff/models/data/adjacent_gantry.csv
  num_nodes: 30

model_switch:
  use_lwrres: true
  st_layers: 2
  use_simple_layer: false

optimization:
  batch_size: 32
  train_epochs: 3
  patience: 15
  learning_rate: 0.0005
  loss_type: MAE
  num_workers: 0
  lradj: type1
  use_amp: false

is_diff: 1
diff_steps: 100
s_steps: 2
skip_type: time_uniform
method: multistep
order: 2
lower_order_final: "true"
sample_times: 20
vs_times: 5
use_mom: 1
new_norm: 1
rmom: 20
n_b: 5
coss: 0.008

metrics:
  use_dtw: false
