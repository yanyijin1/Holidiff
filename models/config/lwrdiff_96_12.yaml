# LWRDiff Training Configuration - pred_len=12
# Based on need/LWRdiff/script/train_msst_speed.yaml

experiment:
  name: lwrdiff_train
  task_name: long_term_forecast
  model: LWRdiff
  model_id: lwrdiff_96_12
  des: lwrdiff_baseline
  itr: 1
  seed: 42

data:
  data: custom
  root_path: /root/yanyijin/STdiff/models/data/
  data_path: msst_speed.csv
  features: M
  target: s0
  freq: t
  enc_in: 30
  dec_in: 30
  c_out: 30

graph:
  enabled: true
  adj_path: /root/yanyijin/STdiff/models/data/adjacent_gantry.csv
  num_nodes: 30

window:
  seq_len: 96
  label_len: 48
  pred_len: 12

model_args:
  e_layers: 1
  d_model: 128
  num_heads: 8
  stride: 3
  patch_len: 6
  dropout: 0.0
  skip_dropout: 0.3
  d_ff: 512

optimization:
  batch_size: 32
  train_epochs: 1
  patience: 3
  learning_rate: 0.0001
  loss_type: MAE

sampling:
  is_diff: 1
  diff_steps: 100
  s_steps: 2
  skip_type: time_uniform
  method: multistep
  order: 2
  lower_order_final: "true"
  sample_times: 20
  vs_times: 5
  use_mom: 1
  new_norm: 1
  rmom: 20
  n_b: 5
  coss: 0.008

metrics:
  use_dtw: false  # Set to true to enable DTW metric (time consuming)
