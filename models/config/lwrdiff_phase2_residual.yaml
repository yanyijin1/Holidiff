# LWRRes 配置文件
# 基于交通流守恒律的残差扩散预测模型
# 与 phase1_pcgk.yaml 保持公平对比

experiment:
  task_name: long_term_forecast
  model: LWRdiff_res
  model_id: lwrdiff_phase2_residual
  des: LWRRes_custom_ftM
  itr: 1
  seed: 42  # 与 phase1 一致

data:
  data: custom
  root_path: /root/yanyijin/STdiff/models/data/  # 与 phase1 一致
  data_path: msst_speed.csv
  flow_path: msst_flow.csv
  features: M
  target: s0
  freq: t  # 与 phase1 一致
  enc_in: 30
  dec_in: 30
  c_out: 30

window:
  seq_len: 96
  label_len: 48
  pred_len: 12

model_args:
  e_layers: 2  # 残差模型需要更多层
  d_layers: 1
  d_model: 64
  num_heads: 4
  d_ff: 256
  dropout: 0.1
  stride: 3
  patch_len: 6
  embed: timeF
  activation: gelu
  output_attention: false
  skip_dropout: 0.1
  use_tst_layer: false

graph:
  enabled: true
  adj_path: /root/yanyijin/STdiff/models/data/adjacent_gantry.csv
  num_nodes: 30

model_switch:
  use_lwrres: true  # 启用 LWRRes 模型
  st_layers: 2
  use_simple_layer: false

optimization:
  batch_size: 32
  train_epochs: 15
  patience: 8  # 与 phase1 一致
  learning_rate: 0.0005  # 与 phase1 一致
  loss_type: MAE  # 与 phase1 一致
  num_workers: 0
  lradj: type1
  use_amp: false

# 扩散配置 - 与 phase1_pcgk.yaml 保持一致
is_diff: 1  # 启用扩散采样
diff_steps: 100
s_steps: 2  # 与 phase1 一致（影响采样速度）
skip_type: time_uniform
method: multistep
order: 2
lower_order_final: "true"  # 与 phase1 一致
sample_times: 20  # 与 phase1 一致
vs_times: 5  # 与 phase1 一致
use_mom: 1
new_norm: 1
rmom: 20
n_b: 5
coss: 0.008

metrics:
  use_dtw: false
