# SimDiff Phase 0 基线配置 - pred_len=36
# 目标：证明"纯时序扩散无法处理36步长程"
# 预期结果：36步MAE > 2.0（vs 12步MAE ~1.6）

experiment:
  name: simdiff_36step_baseline
  task_name: long_term_forecast
  model: SimDiff
  model_id: simdiff_36step
  des: phase0_baseline_36step
  itr: 1
  seed: 42

# 模型切换配置 - 使用原始SimDiff（无STFormerBone）
model_switch:
  use_stformer: false  # false=使用原始SimDiff（纯时序扩散）
  st_layers: 0

data:
  data: custom
  root_path: ./dataset/
  data_path: msst_speed.csv
  features: M
  target: s0
  freq: t
  enc_in: 30
  dec_in: 30
  c_out: 30

# 不使用空间图结构（纯时序基线）
graph:
  enabled: false
  adj_path: null
  num_nodes: 30

window:
  seq_len: 96
  label_len: 48
  pred_len: 36  # 关键：从12改为36

# 基础模型参数
model_args:
  e_layers: 1
  d_model: 64
  num_heads: 4
  stride: 6
  patch_len: 6
  dropout: 0.1
  skip_dropout: 0.1
  d_ff: 256

optimization:
  batch_size: 32
  train_epochs: 30  # 完整训练
  patience: 8
  learning_rate: 0.0005
  loss_type: MAE

# 采样配置 - 长程需要更多步
sampling:
  is_diff: 1
  diff_steps: 1000
  s_steps: 20  # 关键：长程需要更多采样步（短程S=2，长程S=20）
  skip_type: time_uniform
  method: multistep
  order: 2
  lower_order_final: "true"
  sample_times: 5
  vs_times: 5
  use_mom: 1
  new_norm: 1
  rmom: 20
  n_b: 5
  coss: 0.008

metrics:
  use_dtw: false
